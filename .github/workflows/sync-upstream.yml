name: Sync Fork to Upstream (All Branches)

on:
  push:
    branches:
      - '**'

jobs:
  sync:
    # Add this 'if' condition to the job:
    # Only run this job if the repository is your fork
    if: github.repository == 'ncsizemore/jheem2_interactive'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Push changes to upstream
        env:
          UPSTREAM_PAT: ${{ secrets.UPSTREAM_PAT }} # Assuming secret exists in the fork
          # UPSTREAM_REPO is not strictly needed here if using the direct push URL
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          echo "PAT environment variable length: ${#UPSTREAM_PAT}"
          if [ ${#UPSTREAM_PAT} -gt 0 ]; then
            echo "PAT environment variable seems set."
          else
            echo "::error::PAT environment variable is EMPTY!"
            exit 1
          fi

      # Optional force push step would also be skipped due to the job 'if' condition

      # Optional: Add a force push step if needed (use with extreme caution!)
      # Uncomment ONLY if you understand the risks and need to overwrite upstream history.
      # - name: Force push changes to upstream (Use with caution!)
      #   if: false # Set to true only if you need force push
      #   env:
      #     UPSTREAM_PAT: ${{ secrets.UPSTREAM_PAT }}
      #     UPSTREAM_REPO: https://github.com/tfojo1/jheem2_interactive.git
