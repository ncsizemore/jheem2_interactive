name: Sync Fork to Upstream (All Branches)

on:
  push:
    branches:
      - '**'

jobs:
  sync:
    if: github.repository == 'ncsizemore/jheem2_interactive'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # *** CHANGE: Explicitly disable credential persistence from checkout ***
          persist-credentials: false

      - name: Set up Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Configure Upstream Remote with PAT
        env:
          UPSTREAM_PAT: ${{ secrets.UPSTREAM_PAT }}
          GH_USERNAME: ncsizemore
        run: |
          echo "Configuring upstream remote..."
          git remote remove upstream || true
          git remote add upstream "https://github.com/tfojo1/jheem2_interactive.git"
          # *** Ensure this push URL is correct and uses the PAT ***
          git remote set-url upstream --push "https://${GH_USERNAME}:${UPSTREAM_PAT}@github.com/tfojo1/jheem2_interactive.git"
          echo "Verifying remote configuration:"
          git remote -v

      # *** NEW STEP: Unset any interfering Git credential helper ***
      - name: Unset Git credential helper (if any)
        run: |
          git config --local --unset-all credential.helper || true
          echo "Attempting to unset credential.helper"

      - name: Push changes to upstream
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          echo "Attempting to push changes on branch '${BRANCH_NAME}' from fork to upstream repository..."
          # Push should now only use the URL credential
          git push upstream HEAD:${BRANCH_NAME}
          echo "Push for branch '${BRANCH_NAME}' completed."