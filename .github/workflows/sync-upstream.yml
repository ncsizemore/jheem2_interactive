name: Sync Fork to Upstream (All Branches)

on:
  push:
    branches:
      - '**'

jobs:
  sync:
    # Only run this job if the repository is your fork
    if: github.repository == 'ncsizemore/jheem2_interactive' # Ensure this matches your fork name
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Disable credential persistence from checkout
          persist-credentials: false

      - name: Set up Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Configure Upstream Remote with PAT
        env:
          # Only the PAT secret is needed now
          UPSTREAM_PAT: ${{ secrets.GH_PAT }}
        run: |
          echo "Configuring upstream remote..."
          git remote remove upstream || true
          # Add fetch URL (doesn't need PAT)
          git remote add upstream "https://github.com/tfojo1/jheem2_interactive.git"
          # Set push URL using x-access-token and the PAT environment variable
          git remote set-url upstream --push "https://x-access-token:${UPSTREAM_PAT}@github.com/tfojo1/jheem2_interactive.git"
          echo "Verifying remote configuration:"
          git remote -v

      - name: Unset Git credential helper (if any)
        run: |
          git config --local --unset-all credential.helper || true
          echo "Attempting to unset credential.helper"

      - name: Push changes to upstream
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          echo "Attempting to push changes on branch '${BRANCH_NAME}' from fork to upstream repository..."
          # Push using the configured 'upstream' remote name
          git push upstream HEAD:${BRANCH_NAME}
          echo "Push for branch '${BRANCH_NAME}' completed."