name: Sync Fork to Upstream (All Branches) # Updated name slightly for clarity

on:
  push:
    branches:
      - '**' # Trigger on push to any branch (matches main, feature/xyz, etc.)
            # This pattern also effectively ignores tag pushes.

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Fetch all history so we can push correctly
          fetch-depth: 0

      - name: Set up Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Push changes to upstream
        env:
          UPSTREAM_PAT: ${{ secrets.GH_PAT }}
          UPSTREAM_REPO: https://github.com/tfojo1/jheem2_interactive.git
          # github.ref_name will contain the exact branch name that was pushed
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          echo "Attempting to push changes on branch '${BRANCH_NAME}' to upstream repository..."
          # Use the PAT for authentication
          # HEAD:${BRANCH_NAME} pushes the current commit (HEAD from checkout)
          # to the branch with the *same name* on the upstream remote.
          # This command will create the branch on upstream if it doesn't exist.
          git push https://x-access-token:${UPSTREAM_PAT}@github.com/tfojo1/jheem2_interactive.git HEAD:${BRANCH_NAME}
          echo "Push for branch '${BRANCH_NAME}' completed."

      # Optional: Add a force push step if needed (use with extreme caution!)
      # Uncomment ONLY if you understand the risks and need to overwrite upstream history.
      # - name: Force push changes to upstream (Use with caution!)
      #   if: false # Set to true only if you need force push
      #   env:
      #     UPSTREAM_PAT: ${{ secrets.UPSTREAM_PAT }}
      #     UPSTREAM_REPO: https://github.com/tfojo1/jheem2_interactive.git
      #     BRANCH_NAME: ${{ github.ref_name }}
      #   run: |
      #     echo "WARNING: Force pushing changes on branch ${BRANCH_NAME} to upstream repository..."
      #     git push --force https://x-access-token:${UPSTREAM_PAT}@github.com/tfojo1/jheem2_interactive.git HEAD:${BRANCH_NAME}
      #     echo "Force push completed."