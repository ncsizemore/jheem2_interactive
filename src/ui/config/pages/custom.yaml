# src/ui/config/pages/custom.yaml - CDC Testing impact settings

# Subgroups configuration - CDC Testing uses whole population approach
# Keep minimal structure for compatibility with existing UI logic
subgroups:
  fixed: true
  count: 1
  groups:
    - id: "whole_population"
      label: "CDC-Funded Testing Programs"
      description: "Impact on CDC-funded HIV testing programs"

# Intervention configuration
interventions:
  # Implementation timing with month/year selection
  dates:
    type: "date_range_month_year"
    start:
      type: "select"
      input_style: "choices"
      multiple: false
      label: "Programs End:"
      description: "Select when CDC testing programs would end"
      show_label: true
      placeholder: "Select start year..."
      value: "2025-07"
      month_options:
        jan:
          id: "01"
          label: "January"
        feb:
          id: "02"
          label: "February"
        mar:
          id: "03"
          label: "March"
        apr:
          id: "04"
          label: "April"
        may:
          id: "05"
          label: "May"
        jun:
          id: "06"
          label: "June"
        jul:
          id: "07"
          label: "July"
        aug:
          id: "08"
          label: "August"
        sep:
          id: "09"
          label: "September"
        oct:
          id: "10"
          label: "October"
        nov:
          id: "11"
          label: "November"
        dec:
          id: "12"
          label: "December"
      year_options:
        2025:
          id: "2025"
          label: "2025"
        2026:
          id: "2026"
          label: "2026"
        2027:
          id: "2027"
          label: "2027"
        2028:
          id: "2028"
          label: "2028"
        2029:
          id: "2029"
          label: "2029"
        2030:
          id: "2030"
          label: "2030"
    end:
      type: "select"
      input_style: "choices"
      multiple: false
      label: "Programs Begin to Return:"
      description: "Select when (or if) programs would begin to return"
      show_label: true
      placeholder: "Select return year (if applicable)..."
      value: "never"
      never_option:
        id: "never"
        label: "Never Return"
      month_options:
        jan:
          id: "01"
          label: "January"
        feb:
          id: "02"
          label: "February"
        mar:
          id: "03"
          label: "March"
        apr:
          id: "04"
          label: "April"
        may:
          id: "05"
          label: "May"
        jun:
          id: "06"
          label: "June"
        jul:
          id: "07"
          label: "July"
        aug:
          id: "08"
          label: "August"
        sep:
          id: "09"
          label: "September"
        oct:
          id: "10"
          label: "October"
        nov:
          id: "11"
          label: "November"
        dec:
          id: "12"
          label: "December"
      year_options:
        2027:
          id: "2027"
          label: "2027"
        2028:
          id: "2028"
          label: "2028"
        2029:
          id: "2029"
          label: "2029"

  # Recovery duration selector
  recovery_duration:
    type: "select"
    input_style: "choices"
    multiple: false
    label: "Recovery Duration:"
    description: "Select how long it takes for programs to return to normal after they begin to return"
    show_label: true
    placeholder: "Select recovery duration..."
    value: "12"
    visibility:
      depends_on: "end_never"
      show_when: false
    options:
      3:
        id: "3"
        label: "3 months"
      6:
        id: "6"
        label: "6 months"
      12:
        id: "12"
        label: "12 months"
      24:
        id: "24"
        label: "24 months"

  # Intervention components - each group will use this same component
  components:
    testing_reduction:
      type: "numeric"
      label: "Reduction in CDC-funded testing (percent)"
      description: "Percentage by which CDC-funded HIV testing programs are reduced"
      placeholder: "Enter percentage..."
      min: 0
      max: 100
      step: 1
      value: 50
      format: "percentage"
    
    proportion_tested_regardless:
      type: "numeric"
      label: "People who continue testing without CDC funding (percent)"
      description: "Percentage of people who continue to get HIV tests even without CDC-funded programs"
      placeholder: "Enter percentage..."
      min: 0
      max: 100
      step: 5
      value: 50
      format: "percentage"

# Simulation file configuration - pointing to cdct-ws files for intervention execution
custom_simulations:
  provider: "local"  # Options: "local", "onedrive" - change to "onedrive" to use OneDrive
  file_pattern: "cdct-ws/final.ehe.state-80/{location}/cdct-ws_final.ehe.state-80_{location}_baseline.Rdata"
  config_file: "src/data/providers/onedrive_resources/onedrive_sharing_links.json"  # Path to sharing links file
