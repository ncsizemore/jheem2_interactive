# config/pages/prerun.yaml - Pre-run page specific settings
# Updated for CDC Testing branch

# Selector configurations
selectors:
  scenario:
    type: "select"
    input_style: "choices"
    label: "Testing Scenario"
    description: "Select the impact scenario for CDC-funded HIV testing"
    show_label: false
    show_description: false
    placeholder: "Select a scenario..."
    value: "cdct.end"  # Default to cessation scenario
    options:
      cdct.bintr:
        id: "cdct.bintr"
        label: "Brief Interruption of CDC Testing"
        description: "CDC-funded testing programs are temporarily reduced"
      cdct.pintr:
        id: "cdct.pintr"
        label: "Prolonged Interruption of CDC Testing"
        description: "CDC-funded testing programs are reduced for an extended period"
      cdct.end:
        id: "cdct.end"
        label: "Complete Cessation of CDC Testing"
        description: "All CDC-funded HIV testing programs are permanently ended"

# Simulation file configuration - pointing directly to cdct-w files
prerun_simulations:
  provider: "local"  # Options: "local", "onedrive" - change to "onedrive" to use OneDrive
  file_pattern: "cdct-w/final.ehe.state-80/{location}/cdct-w_final.ehe.state-80_{location}_{scenario}.Rdata"
  config_file: "src/data/providers/onedrive_resources/onedrive_sharing_links.json"  # Path to sharing links file


# Execution settings
execution:
  requires_full_model_load: true
