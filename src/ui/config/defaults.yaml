# src/ui/config/defaults.yaml
# Default configurations used across the application

# Core application-wide defaults and shared configurations
defaults:
  panel:
    width: 300
    collapsible: true
    defaultVisible: true
  display:
    plot:
      height: "600px"
      defaultType: "static"
  buttons:
    generate:
      label: "Generate Projections"
      primary_class: "btn-primary"
  feedback:
    generate:
      message: "This will take 10-30 seconds"
      show_message: false
      show_chime: false
      chime_label: "Play a chime when done"

# Display settings
display:
  plot:
    height: "600px"
    defaultType: "static"
    container_class: "plot-container"
  loading:
    message: "Generating plot..."
    class: "loading-indicator"

# Section configurations
sections:
  # NOTE: Some sections (like timing and components) are defined here but handled manually in the code.
  # See create_custom_intervention_content() for implementation details.
  location:
    title: "Location"
    description: "Select the geographic area for the model"
    selectors: ["location"]
  scenario:
    title: "Funding Scenario"
    description: "Select whether Ryan White funding is briefly interrupted, completely ceases, or interrupted for an extended period"
    selectors: ["scenario"]
  timing:
    title: "Programs Change Timeline"
    description: "Define when Ryan White programs end and when they begin to return"
  components:
    title: "Viral Suppression Loss"
    description: "Configure viral suppression loss for each recipient group"

# Panel configurations
panels:
  left:
    id: "intervention-panel"
    header: "Ryan White Funding Impact"
    description: "Explore the impact of changes to Ryan White program funding on HIV transmission and viral suppression."
    width: 300
    collapsible: true
    defaultVisible: true
  right:
    id: "settings-panel"
    header: "Figure Settings"
    description: "Customize how the results are displayed."
    width: 300
    collapsible: true
    defaultVisible: true

# Input type defaults - used across all pages
input_types:
  select:
    default_style: "choices"
    multiple: false
  radio:
    default_style: "native"
    multiple: false
  checkbox:
    default_style: "native"
    multiple: true
  numeric:
    default_style: "native"
    multiple: false

# Common selectors used across multiple pages
selectors:
  location:
    type: "select"
    label: "Location"
    description: "Select the state for the model"
    show_label: false
    show_description: false
    placeholder: "Select a state..."
    value: "NY"  # Default to New York
    options:
      alabama:
        id: "AL"
        label: "Alabama"
      california:
        id: "CA"
        label: "California"
      florida:
        id: "FL" 
        label: "Florida"
      georgia:
        id: "GA"
        label: "Georgia"
      illinois:
        id: "IL"
        label: "Illinois"
      louisiana:
        id: "LA"
        label: "Louisiana"
      missouri:
        id: "MO"
        label: "Missouri"
      mississippi:
        id: "MS"
        label: "Mississippi"
      new_york:
        id: "NY"
        label: "New York"
      texas:
        id: "TX"
        label: "Texas"
      wisconsin:
        id: "WI"
        label: "Wisconsin"


# Model dimension mappings - used for translating UI to model values
model_dimensions:
  age:
    ui_field: "age_groups"
    mappings:
      "13-24": "13-24 years"
      "25-34": "25-34 years"
      "35-44": "35-44 years"
      "45-54": "45-54 years"
      "55plus": "55+ years"
  
  sex:
    ui_field: "biological_sex"
    mappings:
      "heterosexual_male": "heterosexual_male"
      "msm": "msm"
      "female": "female"
  
  risk:
    ui_field: "risk_factor"
    mappings:
      "never_IDU": "never_IDU"
      "active_IDU": "active_IDU"
      "IDU_in_remission": "IDU_in_remission"
  
  race:
    ui_field: "race_ethnicity"
    mappings:
      "black": "black"
      "hispanic": "hispanic"
      "other": "other"

# Testing mode configuration
testing:
  enabled: false  # Set to true for test mode
  simulations:
    prerun:
      file: "test/prerun/C.12580/permanent_loss.Rdata"
    custom:
      file: "test/custom/base/C.12580_base.Rdata"

